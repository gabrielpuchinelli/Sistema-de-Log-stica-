<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>RMSLogis | Nova Saida</title>
</head>
<body data-page="nova-saida">
    <aside class="sidebar">
        <a class="logo" href="dashboard.html">RMSLogis</a>
        <nav class="menu" aria-label="Menu principal"></nav>
    </aside>

    <main class="main">
        <header class="topbar">
            <div>
                <h1>Nova saida</h1>
                <p>Registre os pacotes liberados para entrega</p>
            </div>
            <div class="usuario" data-user>Operador</div>
        </header>

        <section class="form-panel">
            <h2>Registrar saida</h2>
            <form class="form-grid" data-form="route">
                <label>Data<input name="data" type="date" required></label>
                <label>Entregador<select name="driverId" data-driver-select required></select></label>
                <label>Pacotes na saida<input name="saida" type="number" min="1" placeholder="0" required></label>
                <label>Valor por pacote<input name="valorPacote" type="number" min="0" step="0.01" placeholder="1.00" required></label>
                <label>Observacao<input name="observacao" type="text" placeholder="Opcional"></label>
                <button class="btn btn-primary" type="submit">Registrar saida</button>
            </form>
        </section>

        <section class="tabela-container">
            <div class="section-title">
                <h2>Saidas em aberto</h2>
                <span data-open-count>0 abertas</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Entregador</th>
                        <th>Pacotes</th>
                        <th>Valor unitario</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody data-open-routes-table></tbody>
            </table>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
